<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Locomotive Editor</title>
  <link rel="apple-touch-icon" href="/static/grafics/apple-touch-icon-180.png">
  <script>window.CONFIG_PATH = "{{ config_path }}"; // HTTP base for user data (icons etc.)</script>
  <style>
    :root {
      --editor-blue: #527ba3;
      --editor-navy: #2d4b76;
      --editor-border: #7897b5;
      --editor-label: #d2deed;
      --editor-value: #263b56;
      --editor-value-bg: #f1f4f7;
    }
    html, body {
      background: var(--editor-blue);
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100%;
    }
    .editor-wrap {
      box-sizing: border-box;
      max-width: 480px;
      margin: 0 auto;
      padding: 1rem 1.2rem 2rem;
      background: var(--editor-blue);
    }
    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      box-sizing: border-box;
      padding: 0.75rem 1rem;
      background: var(--editor-navy);
    }
    .editor-header h1 { color: #fff; font-size: 1.1rem; margin: 0; }
    .editor-protocol { color: var(--editor-label); font-size: 0.8rem; margin: 0.2rem 0 0; }
    .back-link { color: #fff; text-decoration: none; font-size: 0.95rem; white-space: nowrap; }
    .editor-icon-wrap { text-align: center; margin-bottom: 1.25rem; }
    .editor-loco-icon {
      max-width: 220px;
      max-height: 120px;
      object-fit: contain;
      border-radius: 4px;
      background: var(--editor-navy);
    }
    .pom-heading { color: #fff; font-size: 1rem; margin: 0 0 0.5rem; }
    table.cv-table { width: 100%; border-collapse: collapse; }
    table.cv-table th, table.cv-table td { text-align: left; padding: 0.55rem 0.4rem; border-bottom: 1px solid var(--editor-border); }
    table.cv-table th { color: var(--editor-label); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
    table.cv-table td:first-child { color: var(--editor-label); }
    table.cv-table td.cv-idx { color: #fff; font-variant-numeric: tabular-nums; }
    .cv-value {
      display: inline-block;
      min-width: 2.5rem;
      box-sizing: border-box;
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
      background: var(--editor-value-bg);
      color: var(--editor-value);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .cv-value[data-cv-field="name"] { font-weight: 400; }
    .cv-value-cell { white-space: nowrap; }
    .cv-value-input {
      box-sizing: border-box;
      width: 4.5rem;
      padding: 0.3rem;
      border: 1px solid var(--editor-border);
      border-radius: 3px;
      background: var(--editor-value-bg);
      color: var(--editor-value);
      font: inherit;
    }
    .cv-index-input {
      box-sizing: border-box;
      width: 5rem;
      padding: 0.3rem;
      border: 1px solid var(--editor-border);
      border-radius: 3px;
      background: var(--editor-value-bg);
      color: var(--editor-value);
      font: inherit;
      font-variant-numeric: tabular-nums;
    }
    .cv-write-button, .cv-read-button {
      margin-left: 0.3rem;
      padding: 0.3rem 0.45rem;
      border: 1px solid #24436b;
      border-radius: 3px;
      background: var(--editor-navy);
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    .cv-write-button.is-disabled { opacity: 0.5; cursor: not-allowed; }
    .cv-write-status { display: block; color: var(--editor-label); font-size: 0.7rem; }
    #editorUnsupported { display: none; color: #ffe0df; margin-top: 1rem; }
    #editorStatus { color: var(--editor-label); font-size: 0.85rem; margin-top: 1rem; }
    #editorStatus.warning { color: #ffe0df; font-weight: 600; }
  </style>
</head>
<body class="no-select">
  <div class="editor-header">
    <div>
      <h1 id="editorLocoName">Loading …</h1>
      <p id="editorProtocol" class="editor-protocol">Protocol: …</p>
    </div>
    <a class="back-link" href="/">&larr; Back</a>
  </div>
  <div class="editor-wrap">
    <div class="editor-icon-wrap">
      <img id="editorLocoIcon" class="editor-loco-icon" alt="" />
    </div>
    <h2 id="pomHeading" class="pom-heading">Program on Main (POM)</h2>
    <table class="cv-table" id="cvTable">
      <thead id="cvTableHead"></thead>
      <tbody id="cvTableBody"></tbody>
    </table>
    <p id="editorStatus" role="status" aria-live="polite">Connecting…</p>
    <p id="editorUnsupported">No CVs are currently defined for this decoder protocol.</p>
  </div>
  <script src="/static/loco_editor.js?v=23"></script>
</body>
</html>
